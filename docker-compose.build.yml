# ═══════════════════════════════════════════════════════════════════════════
#  Build override — builds the image from this working tree instead of pulling
#  the published one.
#
#    docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
#  The tag still matches docker-compose.yml, so a later `docker compose pull`
#  replaces your local build with the published image of the same name.
# ═══════════════════════════════════════════════════════════════════════════

services:
  musicdrome:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
