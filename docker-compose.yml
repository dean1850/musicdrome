# ═══════════════════════════════════════════════════════════════════════════
#  Musicdrome
#
#    docker compose up -d                        # just the music server
#    docker compose --profile lidarr up -d       # + Lidarr for torrent sync
#    docker compose --profile ollama up -d       # + local LLM instead of Claude
#    docker compose --profile test run --rm playwright   # E2E suite
#
#  Every value below comes from .env — see .env.example.
# ═══════════════════════════════════════════════════════════════════════════

services:
  musicdrome:
    build:
      context: .
      dockerfile: Dockerfile
    image: musicdrome:latest
    container_name: musicdrome
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Container-internal paths. The host side is set by *_DIR in .env.
      MUSICDROME_MUSIC_DIR: /music
      MUSICDROME_DATA_DIR: /config
      MUSICDROME_CACHE_DIR: /cache
      MUSICDROME_PODCAST_DIR: /podcasts
      MUSICDROME_DOWNLOAD_DIR: /downloads
      MUSICDROME_STATIC_DIR: /app/static
    ports:
      - "${MUSICDROME_PORT:-4533}:${MUSICDROME_PORT:-4533}"
    volumes:
      - "${MUSIC_DIR:-./data/music}:/music:${MUSIC_MOUNT_MODE:-rw}"
      - "${DATA_DIR:-./data/config}:/config"
      - "${CACHE_DIR:-./data/cache}:/cache"
      - "${PODCAST_DIR:-./data/podcasts}:/podcasts"
      - "${DOWNLOAD_DIR:-./data/downloads}:/downloads"
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://127.0.0.1:${MUSICDROME_PORT:-4533}/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    networks:
      - musicdrome

  # ─── Optional: Lidarr ────────────────────────────────────────────────────
  # Handles indexers and the torrent/usenet client. Musicdrome pushes wanted
  # artists here and pulls back what Lidarr imports. Point LIDARR_ROOT_FOLDER
  # at /music so both containers see the same library.
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: musicdrome-lidarr
    profiles: ["lidarr"]
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-UTC}"
    ports:
      - "8686:8686"
    volumes:
      - "${LIDARR_CONFIG_DIR:-./data/lidarr}:/config"
      - "${MUSIC_DIR:-./data/music}:/music"
      - "${DOWNLOAD_DIR:-./data/downloads}:/downloads"
    networks:
      - musicdrome

  # ─── Optional: Ollama ────────────────────────────────────────────────────
  # Set AI_PROVIDER=ollama in .env to route AI work here instead of Claude.
  ollama:
    image: ollama/ollama:latest
    container_name: musicdrome-ollama
    profiles: ["ollama"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - musicdrome

  # ─── Test harness ────────────────────────────────────────────────────────
  playwright:
    build:
      context: .
      dockerfile: tests/Dockerfile.playwright
    profiles: ["test"]
    depends_on:
      musicdrome:
        condition: service_healthy
    environment:
      E2E_BASE_URL: "http://musicdrome:${MUSICDROME_PORT:-4533}"
      E2E_ADMIN_USERNAME: "${E2E_ADMIN_USERNAME:-admin}"
      E2E_ADMIN_PASSWORD: "${E2E_ADMIN_PASSWORD:-testadmin123}"
      CI: "true"
    volumes:
      - ./tests:/tests
      - ./test-results:/tests/test-results
      - ./playwright-report:/tests/playwright-report
    networks:
      - musicdrome

networks:
  musicdrome:
    driver: bridge

volumes:
  ollama-models:
