# ═══════════════════════════════════════════════════════════════════════════
#  Musicdrome
#
#    docker compose up -d
#
#  Runs the published image — no clone, no build. Update with:
#
#    docker compose pull && docker compose up -d
#
#  This file routes Musicdrome through gluetun, so every YouTube request leaves
#  over the VPN. Two consequences worth knowing:
#
#    * Ports are published by gluetun, not here. Add 3046 to the gluetun
#      service's `ports:` to reach the UI.
#    * A VPN exit address is a common cause of "HTTP Error 403" and of "Sign in
#      to confirm you're not a bot" on downloads. Musicdrome impersonates a
#      browser TLS fingerprint, retries, and pauses the queue rather than
#      draining it into failures (see the notes in .env.example) — but none of
#      that makes a flagged exit address acceptable to YouTube. The fix that
#      keeps downloads on the VPN is a cookie file: export cookies.txt in
#      Netscape format and drop it into your DATA_LOCATION folder, beside the
#      database. It is mounted as /config below, so there is nothing to add
#      here and nothing to restart.
#
#  Not using gluetun? Delete `network_mode` and `networks`, then add:
#
#      ports:
#        - "${MUSICDROME_PORT:-3046}:3046"
#        # so http://host.docker.internal:11434 reaches Ollama on the host
#      extra_hosts:
#        - "host.docker.internal:host-gateway"
#
#  Every value below comes from .env — see .env.example.
# ═══════════════════════════════════════════════════════════════════════════

services:
  musicdrome:
    # To pin a build instead of tracking latest, replace the tag with a
    # version (:v2.0.0) or a commit (:sha-abc1234). Both are published.
    image: ghcr.io/dean1850/musicdrome:latest
    container_name: musicdrome
    network_mode: service:gluetun
    restart: unless-stopped
    env_file:
      - .env
    # These three are container paths and never change. They are set here
    # rather than in .env because .env describes your machine, and /music and
    # /config only mean anything inside the container.
    environment:
      MUSICDROME_MUSIC_DIR: /music
      MUSICDROME_DATA_DIR: /config
      # The library is scanned for artist/title tags so nothing you already own
      # is ever suggested to you. It is the same directory downloads are filed
      # into, which is the point: yesterday's download is today's "already have
      # it".
      EXCLUDE_MUSIC_DIR: /music
    volumes:
      # Your music. Downloads are filed here as Artist/Album/01 - Title.mp3,
      # so it has to be writable — a read-only mount fails every download at
      # the last step, after the audio has been fetched and encoded.
      - ${MUSIC_LOCATION:-./data/music}:/music
      # The SQLite database — and, if YouTube starts asking this address to
      # prove it is not a bot, a cookies.txt you drop in beside it. Both are
      # picked up from here, so signing downloads in needs no change to this
      # file.
      - ${DATA_LOCATION:-./data/config}:/config

networks: {}
