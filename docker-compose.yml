# ═══════════════════════════════════════════════════════════════════════════
#  Musicdrome
#
#    docker compose up -d                        # the music server
#    docker compose --profile ollama up -d       # + local LLM instead of Claude
#
#  Lidarr is not part of this stack. Musicdrome talks to your existing Lidarr
#  over its API — set LIDARR_URL and LIDARR_API_KEY in .env.
#
#  Tests are not part of this stack either. Run them from the tests/ directory
#  against a running server — see tests/README.md.
#
#  Every value below comes from .env — see .env.example.
# ═══════════════════════════════════════════════════════════════════════════

services:
  musicdrome:
    build:
      context: .
      dockerfile: Dockerfile
    image: musicdrome:latest
    container_name: musicdrome
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Container-internal paths. The host side is set by *_DIR in .env.
      MUSICDROME_MUSIC_DIR: /music
      MUSICDROME_DATA_DIR: /config
      MUSICDROME_CACHE_DIR: /cache
      MUSICDROME_PODCAST_DIR: /podcasts
      MUSICDROME_DOWNLOAD_DIR: /downloads
      MUSICDROME_STATIC_DIR: /app/static
    ports:
      - "${MUSICDROME_PORT:-4533}:${MUSICDROME_PORT:-4533}"
    volumes:
      - "${MUSIC_DIR:-./data/music}:/music:${MUSIC_MOUNT_MODE:-rw}"
      - "${DATA_DIR:-./data/config}:/config"
      - "${CACHE_DIR:-./data/cache}:/cache"
      - "${PODCAST_DIR:-./data/podcasts}:/podcasts"
      - "${DOWNLOAD_DIR:-./data/downloads}:/downloads"
    # Lets LIDARR_URL=http://host.docker.internal:8686 reach a Lidarr running
    # on the Docker host. Docker Desktop provides this name already; the
    # host-gateway mapping is what makes it work on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://127.0.0.1:${MUSICDROME_PORT:-4533}/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    networks:
      - musicdrome

  # ─── Optional: Ollama ────────────────────────────────────────────────────
  # Set AI_PROVIDER=ollama in .env to route AI work here instead of Claude.
  ollama:
    image: ollama/ollama:latest
    container_name: musicdrome-ollama
    profiles: ["ollama"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - musicdrome

networks:
  musicdrome:
    driver: bridge

volumes:
  ollama-models:
